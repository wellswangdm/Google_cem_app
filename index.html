<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wells Inc. QuoteGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Safe area bottom padding for mobile iOS devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .mb-safe {
            margin-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* Prevent page breaks in the middle of specific blocks for PDF */
        .page-break-avoid {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        /* 
           Styling for the PDF generation target. 
           This ensures that when html2pdf captures the element, 
           it behaves exactly like a standard A4 page.
        */
        #quote-page {
            background: white !important;
            width: 210mm !important;
            min-height: 297mm;
            margin: 0 auto !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            position: relative !important;
            padding: 12mm !important;
            overflow: hidden !important; /* Prevents stray scroll lines in capture */
        }

        /* Custom scrollbar for web view */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media print {
            /* Fallback for system print (optional, but good for zero-margin safety) */
            @page {
                size: A4 portrait;
                margin: 0 !important;
            }
            .print-hidden {
                display: none !important;
            }
            #quote-page {
                box-shadow: none !important;
                border: none !important;
                min-height: 297mm !important;
                height: auto !important;
                padding: 12mm !important;
                display: flex !important;
                flex-direction: column !important;
            }
        }
    </style>
<script type="importmap">
